[device]
codename = "corvette"
brand = "OnePlus"
model = "OnePlus Ace 3 Pro"
ab = true
soc = { hans = "第三代骁龙®8移动平台", hant = "第三代 Snapdragon® 8 行動平台", en = "Snapdragon® 8 Gen 3 Mobile Platform" }
os_version_prop = "ro.build.display.id"
# The stock recovery's USB setup carries adb and fastboot only; offering
# MTP beside them resets the port on OnePlus phones.
mtp = false
# OnePlus's SELinux policy refuses the loop worker the use of a file the
# recovery opened, so the vndk APEX cannot be mounted while enforcing.
permissive = true

[display]
# Read from the running ColorOS system with wm; the stock density is the
# one its display makefile sets.
width = 1264
height = 2780
density = 560
diagonal = 6.78
# The radius the stock settings round a page's corners to.
corner_radius = 114

[modules]
# rfkill, which the WLAN driver asks for, is one of the kernel's own
# modules on system_dlkm.
sources = ["vendor_boot", "vendor_dlkm", "vendor", "system_dlkm"]
# The touchscreen: Synaptics S3910 over SPI, behind OnePlus's HBP layer,
# whose firmware is read from /odm/firmware/tp. The NFC controller carries
# the embedded secure element the weaver reaches.
load = ["oplus_bsp_tp_hbp_syna_s3910", "nxp-nci"]

# The modem partition holds the WLAN chip's firmware, which the phone
# mounts at /vendor/firmware_mnt and its own recovery leaves unmounted.
[firmware]
partition = "modem"

# The persist partition, which the phone mounts at /mnt/vendor/persist and
# which the secure world and the WLAN driver read.
[partitions]
mounted = ["persist"]

# The battery gauge and the charging screen run on ADSP; start it, but
# leave MSS (the cellular modem) offline, which nothing here needs.
[[service]]
path = "/system/bin/sh"
args = ["-c", "for r in /sys/class/remoteproc/remoteproc*; do [ -e \"$r/name\" ] || continue; case \"$(cat \"$r/name\")\" in *adsp*) [ \"$(cat \"$r/state\")\" = running ] || echo start > \"$r/state\";; esac; done"]
oneshot = true
user = "root"
groups = ["root"]

# What the phone's own init runs once the system has finished starting, as
# kernel-post-boot in /vendor/etc/init/hw/init.qti.kernel.rc. The kernel
# starts the CPU clusters on the performance governor; the script hands them
# to WALT and lets idle CPUs power down.
[[service]]
path = "/vendor/bin/sh"
args = ["/vendor/bin/init.kernel.post_boot.sh"]
libraries = ["/system/lib64", "/vendor/lib64"]
oneshot = true
user = "root"
groups = ["root", "system", "wakelock", "graphics"]

# The NFC chip carries the phone's embedded secure element, which the
# weaver reaches through Android's secure element service. The key
# services cannot start without the NFC stack: the NXP eSE service waits
# for the NFC service, and the weaver waits for the eSE service.
[[service]]
path = "/odm/bin/hw/vendor.oplus.hardware.nfc_aidl-service"
libraries = ["/system/lib64", "/vendor/lib64", "/vendor/lib64/hw", "/odm/lib64"]
user = "nfc"
groups = ["nfc"]
ready_service = "vendor.oplus.hardware.nfc.IOplusNfc/default"

[[service]]
path = "/odm/bin/hw/vendor.oplus.hardware.nfcExtns-service"
libraries = ["/system/lib64", "/vendor/lib64", "/vendor/lib64/hw", "/odm/lib64"]
user = "system"
groups = ["nfc", "system"]
ready_service = "vendor.oplus.hardware.nfcExtns.INfcExtns/default"

[[service]]
path = "/odm/bin/hw/android.hardware.nfc-service.nxp"
libraries = ["/system/lib64", "/vendor/lib64", "/vendor/lib64/hw", "/odm/lib64"]
user = "nfc"
groups = ["nfc", "drmrpc", "system"]
ready_service = "android.hardware.nfc.INfc/default"
registers = ["vendor.nxp.nxpnfc_aidl.INxpNfc/default"]

# The NFC driver makes this node as its module loads; the recovery's own
# ueventd leaves it root's, where the eSE service opens it as system in the
# nfc group.
[[owners]]
user = "nfc"
group = "nfc"
mode = 0o660
paths = ["/dev/nq-nci"]

# qcom-hv-haptics, played through OnePlus's effect stream. The frequency
# reads nothing until the motor is first played, and the driver says the
# period instead.
[haptics]
resonance = "/sys/class/qcom-haptics/lra_frequency_hz"
period = "/sys/class/qcom-haptics/t_lra_us"
strength = { lightest = 0.25, strongest = 0.75 }

# The baseband's settings with the IMEI, and what of the data partition the
# secure world keeps in step with itself: its own storage, the fingerprint
# templates and the trusted UI's files.
[backup]
efs = ["modemst1", "modemst2", "fsg", "fsc", "persist"]
data_skipped = ["vendor/tzstorage", "vendor/qtee", "vendor/fingerprint", "vendor/fpc", "vendor/goodix"]

# Where the phone's own programs keep logs and crash dumps in the data
# partition.
[wipe]
logs = [
    "/data/vendor/diag",
    "/data/vendor/log",
    "/data/vendor/oplus/log",
    "/data/vendor/olog",
    "/data/vendor/ramdump",
    "/data/vendor/ssrdump",
    "/data/vendor/tombstones",
    "/data/vendor/wifi",
]

# WLAN: Qualcomm's Kiwi v2 on PCIe, driven by qca_cld3_kiwi_v2 over the
# cnss-kiwi platform driver, with rfkill from system_dlkm loaded before it.
# Once fs_ready is written, cnss2 powers the chip up and loads its firmware
# from the modem partition. OnePlus keeps the board's settings on the odm
# partition, under vendor, where the driver's own link does not reach in a
# recovery.
[wlan]
modules = ["rfkill", "qca_cld3_kiwi_v2"]
writes = [
    { path = "/sys/kernel/cnss/fs_ready", value = "1" },
    { path = "/sys/devices/platform/soc/b0000000.qcom,cnss-kiwi/fs_ready", value = "1" },
]
# The driver leaves the radio blocked until its firmware is up, which is
# only once the interface has been made.
unblock = true
firmware = [
    { name = "wlan/qca_cld/kiwi_v2/WCNSS_qcom_cfg.ini", path = "/odm/vendor/etc/wifi/WCNSS_qcom_cfg.ini" },
]
interface = "wlan0"
supplicant = "/vendor/bin/hw/wpa_supplicant"
libraries = ["/system/lib64", "/vendor/lib64"]
service = "android.hardware.wifi.supplicant.ISupplicant/default"
probe = "http://connectivitycheck.gstatic.com/generate_204"

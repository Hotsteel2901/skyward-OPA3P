[device]
codename = "corvette"
brand = "OnePlus"
model = "OnePlus Ace 3 Pro"
ab = true
soc = { hans = "第三代骁龙®8移动平台", hant = "Snapdragon® 8 Gen 3 行動平台", en = "Snapdragon® 8 Gen 3 Mobile Platform" }
# ro.build.display.id reads PJX110_16.0.5.1301(CN01).
os_version_prop = "ro.build.display.id"

[display]
# The system's displayconfig.xml keeps these for the 1264 by 2780 panel.
width = 1264
height = 2780
density = 560
diagonal = 6.78
# rounded_corner_radius in the system's OPlusFrameworksResTarget overlay.
corner_radius = 114

[modules]
sources = ["vendor_boot", "vendor_dlkm", "vendor"]
# The touchscreen: Synaptics S3910 over SPI, in host-based processing mode,
# which the phone's own modules.dep says is loaded with the common files
# before it. Its firmware and models are in /odm/firmware/tp/23814. The
# vibration motor is Qualcomm's PM8550B haptics, which plays the clicks.
# The WLAN's platform driver is loaded here too, so that the switch that
# starts the chip is there before the WLAN driver is asked for.
load = ["oplus_bsp_synaptics_tcm2", "qcom-hv-haptics", "icnss2"]

[firmware]
# The modem partition keeps the firmware images the phone's processors and
# radios ask for. Its own table mounts it at /vendor/firmware_mnt.
partition = "modem"

[partitions]
# The secure world keeps its own files on persist, which the phone's table
# mounts at /mnt/vendor/persist where its own programs look for them.
mounted = ["persist"]

[wlan]
# WLAN: the WCN7850 on PCIe, driven by qca_cld3_kiwi_v2 over Qualcomm's
# icnss2 platform driver, which the phone's bootargs point at the kiwi_v2
# firmware folder. Once the chip is told to boot, wlan0 appears. The
# vendor partition's firmware folder links the settings and the MAC address
# to the vendor partition and persist, which a recovery covers with the
# modem's, so they are given to the loader again.
modules = ["qca_cld3_kiwi_v2"]
writes = [
    { path = "/sys/kernel/icnss/wlan_en_delay", value = "1000" },
    { path = "/sys/kernel/icnss/wpss_boot", value = "1" },
]
firmware = [
    { name = "wlan/qca_cld/kiwi_v2/WCNSS_qcom_cfg.ini", path = "/vendor/etc/wifi/kiwi_v2/WCNSS_qcom_cfg.ini" },
    { name = "wlan/qca_cld/kiwi_v2/wlan_mac.bin", partition = "persist", path = "kiwi_v2/wlan_mac.bin" },
]
interface = "wlan0"
supplicant = "/vendor/bin/hw/wpa_supplicant"
libraries = ["/vendor/lib64", "/system/lib64"]
service = "android.hardware.wifi.supplicant.ISupplicant/default"
probe = "http://conn1.oppomobile.com/generate_204"

# qcom-hv-haptics. Waveform 0 is the click: 8 pattern samples at 6667 µs
# each (its debugfs entry, haptics/effect0). Qualcomm's vibrator HAL plays
# its light strength at half of a waveform's drive and its strong one at
# the whole of it. The driver says the motor's resonant frequency, which
# the ticks of the screen going off are made at, in lra_frequency_hz.
[haptics]
click = 0
resonance = "/sys/class/qcom-haptics/lra_frequency_hz"
strength = { lightest = 0.5, strongest = 1.0 }

# The partitions a backup of the baseband and EFS takes: the baseband's
# settings, with the IMEI, and the sensors' calibration. The phone names
# its two modem storage partitions modem_st1 and modem_st2. And what of
# the data partition a backup leaves out because the secure world keeps it
# in step with itself: its own storage, the fingerprint templates and the
# secure element's files.
[backup]
efs = ["modem_st1", "modem_st2", "persist"]
data_skipped = ["vendor/tzstorage", "vendor/qtee", "vendor/fingerprint", "vendor/fingerprint_ori", "vendor/secure_element"]

# Where the phone's own programs keep logs in the data partition: the
# system's, the crash records Qualcomm's and OPPO's programs leave, and the
# dumps the modem, Wi-Fi and Bluetooth leave when they crash.
[wipe]
logs = [
    "/data/log",
    "/data/oplus/log",
    "/data/persist_log",
    "/data/misc/bluetooth",
    "/data/vendor/diag",
    "/data/vendor/ramdump",
    "/data/vendor/ssrdump",
    "/data/vendor/tombstones",
    "/data/vendor/wifidump",
]

# The ColorOS build the recovery is made on: 16.0.5.1301, whose full update
# package the phone maker's update service sends the phone's own updater.
# The address is the service's downloadCheck address for that package; it
# answers only the updater, and its answer leads to the package on OPPO's
# CDN. OPPO's update API gives the same build as PJX110_11.F.18, displayed
# as PJX110_16.0.5.1301(CN01).
[stock]
source = "oplus"
version = "16.0.5.1301"
package = "https://component-ota-cn.allawntech.com/downloadCheck?c=a3510dcb9cf55368fbf2f2dfd09ce6eb&p=a6c78fdd3655888b30ce8baa439836329576abb34c3754a6d1b600ee9f2d07c6e2be6bdcb57b6223ba3ad3282179&d=e181cd82745f88956e8098ec0182623bca30a2a51b7b03ead6e04ce9ca7400d5b4e921c5b4276d&g=10eab6008d5642cf42abd2aa41f847cb&id=6aec214f7d8131017f1593fa&taste=0&supportDLTaste=0&mode=1&tr=manual&s=d293c057c3e7e5187fb74345a39033d6"
recovery = "9142a3274e9b80d6167b858e25401093c63247a06c9a0e300aa03aea90cba673"
